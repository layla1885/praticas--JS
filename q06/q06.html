<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 06</title>
    <script src="./q06.js" defer></script>
</head>
<body>
    <h1>Questão 06</h1>

    <p>
        Calcule a nota final de um aluno considerando N1 com peso 2 e N2 com peso 3.
        A nota mínima para aprovação é 6,0.
    </p>

    <form id="formDados">
        <label for="n1">Nota N1:</label>
        <input type="number" step="0.1" min="0" max="10" id="n1">

        <label for="n2">Nota N2:</label>
        <input type="number" step="0.1" min="0" max="10" id="n2">

        <button type="submit">Calcular nota final</button>
    </form>

    <p id="resultado"></p>
</body>
</html>
